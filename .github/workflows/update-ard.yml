name: Refresh latest ARD Tagesschau
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve most recent official ARD episode
        run: python scripts/update_ard.py
      - name: Commit only if episode changed
        run: |
          if ! git diff --quiet -- data/ard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ard.json
            git commit -m "Update ARD Tagesschau embed"
            git push
          else
            echo "ARD embed already up to date."
          fi
