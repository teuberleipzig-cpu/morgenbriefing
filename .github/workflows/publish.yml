name: Generate podcast and deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - data/edition.json
      - scripts/build_audio.py
      - .github/workflows/publish.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare publication folder
        run: mkdir -p _site/data _site/audio
      - name: Generate MP3 only when script exists
        run: |
          if python -c "import json; assert bool(json.load(open('data/edition.json')).get('podcast_script','').strip())"; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
            python -m pip install 'piper-tts==1.3.0'
            python scripts/build_audio.py
          else
            echo "No podcast script. Publishing honest empty-player state."
          fi
      - name: Stage content
        run: |
          cp index.html _site/
          cp data/edition.json _site/data/
          if [ -d audio ]; then cp -r audio/. _site/audio/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
